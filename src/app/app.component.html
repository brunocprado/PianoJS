<div class="app-shell">
  <p-toolbar styleClass="app-toolbar">
    <ng-template #start>
      <div class="flex flex-wrap items-center gap-3">
        @if (piano.sustainPedal()) {
          <p-tag severity="info" value="Sustain" icon="pi pi-arrow-down" [rounded]="true" />
        }
        @if (piano.recording()) {
          <p-tag severity="danger" value="REC" icon="pi pi-circle-fill" [rounded]="true" />
        }
      </div>
    </ng-template>

    <ng-template #end>
      <div class="flex flex-wrap items-center gap-2">
        <p-button
          icon="pi pi-cog"
          label="Configurações"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="openSettings()" />
        <p-button
          icon="pi pi-download"
          label="Samples"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="load()" />
        <p-button
          [icon]="piano.recording() ? 'pi pi-stop' : 'pi pi-circle'"
          [label]="piano.recording() ? 'Salvar MIDI' : 'Gravar'"
          [severity]="piano.recording() ? 'danger' : 'secondary'"
          [outlined]="!piano.recording()"
          size="small"
          (onClick)="toggleRecording()" />
        <p-button
          icon="pi pi-file-import"
          label="Abrir MIDI"
          size="small"
          (onClick)="triggerMidiUpload()" />
        <input
          #midiInput
          type="file"
          class="hidden"
          accept=".mid,.midi,audio/midi"
          (change)="loadMidi($event)" />
      </div>
    </ng-template>
  </p-toolbar>

  <app-settings-dialog
    [visible]="showSettings()"
    (closed)="closeSettings()"
    (applied)="onSettingsApplied()" />

  <div class="stage-panel">
    <div class="notes-stage">
      <app-notes-display class="block h-full min-h-0 w-full flex-1"></app-notes-display>
    </div>
    <div class="keyboard-dock">
      <app-keyboard></app-keyboard>
    </div>
  </div>
</div>
