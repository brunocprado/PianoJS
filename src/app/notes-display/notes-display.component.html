<div class="display-root" #root>
  <canvas #canvas class="notes-canvas" aria-hidden="true"></canvas>

  @if (currentLyric()) {
    <div class="lyrics-chip">{{ currentLyric() }}</div>
  }

  <p-toolbar styleClass="playback-bar">
    <ng-template #start>
      <p-tag
        [value]="(piano.curTime()/1000).toFixed(2) + 's'"
        icon="pi pi-clock"
        severity="secondary"
        [rounded]="true" />
    </ng-template>
    <ng-template #end>
      <p-button
        [icon]="piano.playing() ? 'pi pi-pause' : 'pi pi-play'"
        [label]="piano.playing() ? 'Pausar' : 'Retomar'"
        size="small"
        [rounded]="true"
        (onClick)="pause()" />
    </ng-template>
  </p-toolbar>
</div>
