<p-dialog
  header="Configurações"
  styleClass="settings-dialog"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [style]="{ width: '440px', maxWidth: '95vw' }">

  <ng-template #header>
    <div class="flex items-center gap-3">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-500/15 text-indigo-300">
        <i class="pi pi-sliders-h"></i>
      </span>
      <div>
        <div class="text-base font-semibold leading-tight">Configurações</div>
        <div class="text-xs text-white/55">Teclado, oitavas e tipo de som</div>
      </div>
    </div>
  </ng-template>

  @if (draft(); as d) {
    <div class="grid gap-5 pt-1">
      <div class="settings-field">
        <label for="start-octave">Oitava inicial</label>
        <p-select
          inputId="start-octave"
          [options]="startOctaveOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="d.minOctave"
          (ngModelChange)="updateDraft({ minOctave: $event })"
          styleClass="w-full"
          appendTo="body" />
      </div>

      <div class="settings-field">
        <label for="octave-count">Extensão do teclado</label>
        <p-select
          inputId="octave-count"
          [options]="octaveCountOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="d.octaveCount"
          (ngModelChange)="updateDraft({ octaveCount: $event })"
          styleClass="w-full"
          appendTo="body" />
      </div>

      <div class="settings-toggle-row">
        <div>
          <div class="text-sm font-medium">Samples de piano</div>
          <div class="mt-0.5 text-xs text-white/55">Usar arquivos .wav por nota</div>
        </div>
        <p-toggleswitch
          [ngModel]="d.useSamples"
          (ngModelChange)="updateDraft({ useSamples: $event })" />
      </div>

      <p class="m-0 rounded-xl border border-white/8 bg-white/[0.02] px-3.5 py-3 text-xs leading-relaxed text-white/55">
        Com samples desativados, o piano usa osciladores sintéticos — útil enquanto os arquivos não estão carregados.
      </p>
    </div>
  }

  <ng-template #footer>
    <div class="flex w-full justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="onVisibleChange(false)" />
      <p-button label="Aplicar" icon="pi pi-check" (onClick)="applySettings()" />
    </div>
  </ng-template>
</p-dialog>
